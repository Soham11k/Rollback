global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: rewind
    metrics_path: /metrics
    static_configs:
      - targets: ["rewind:8090"]
        labels:
          service: rewindai

  - job_name: gatepass
    metrics_path: /metrics
    static_configs:
      - targets: ["gatepass:8080"]
        labels:
          service: gatepass
          app: gatepass
