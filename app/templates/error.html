{% extends "base.html" %}
{% block title %}Error · GatePass{% endblock %}
{% block body %}
<section class="panel">
  <p class="giant-code">500</p>
  <h2>Checkout path failed</h2>
  <p class="empty">{{ message }}</p>
  <p class="note">/health is still answering 200. Release {{ version }} · fault mode {{ fault_mode }}.</p>
  <a class="text-link" href="{{ url_for('console') }}">Open developer console</a>
</section>
{% endblock %}
